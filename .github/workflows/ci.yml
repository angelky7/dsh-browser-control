name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm run typecheck

      - name: 重新构建 lib/
        run: pnpm exec tsc -p tsconfig.json && pnpm exec tsdown

      # 这条专门堵 v1.0.7 那类事故：src/ 加了工具却没重新打包，
      # 结果发布出去的 lib/index.js 只注册了 11 个工具（源码里有 16 个）。
      # 提交里带上构建产物，所以产物与源码不一致就是 bug，直接在 CI 失败。
      - name: 构建产物必须与源码同步
        run: |
          git add -A lib
          if ! git diff --cached --quiet; then
            echo "::error::lib/ 与 src/ 不一致——提交前请运行 npm run build 并把 lib/ 一起提交"
            git diff --cached --stat
            exit 1
          fi

      - name: 包结构检查
        run: pnpm exec publint

      # 四方对账（扩展命令表 ↔ 插件调用 ↔ README 工具表 ↔ 构建产物）、
      # 三种宿主形状的 apply()、HTTP 鉴权与升级来源、错误契约、协议握手、发布产物行为。
      - name: 实测台
        run: pnpm run verify

      # 匿名访问 api.github.com 只有 60 次/小时配额，runner 共用出口 IP 时会被限到 403，
      # curl -f 于是以 exit 22 失败 —— 那是配额问题，不是文档里有死链。
      # 带 GITHUB_TOKEN 是 5000 次/小时；再重试三次，仍拉不到就明确报"审计没执行"，
      # 而不是悄悄放绿（审计本身照旧是致命步骤）。
      - name: 文档里的 release 下载链接不得为死链
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          auth=()
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            auth=(-H "Authorization: Bearer $GITHUB_TOKEN")
          fi
          fetch() {
            curl -sfL "${auth[@]}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases?per_page=100"
          }
          ok=0
          for attempt in 1 2 3; do
            if fetch > /tmp/releases.json && [ -s /tmp/releases.json ]; then
              ok=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "releases 列表拉取失败（第 $attempt 次），10s 后重试"
              sleep 10
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::三次都没能拉到 releases 列表，死链审计没有执行——先查 api.github.com 可达性与令牌配额，别当成链接没问题"
            exit 1
          fi
          node verify/verify_release_links.mjs /tmp/releases.json

  windows:
    # 这个插件的实际宿主平台是 Windows（用户和开发者都在 Windows 上跑 dsh），
    # 但 CI 以前只有 ubuntu：换行符、path.join/resolve、临时目录、回环绑定这些差异
    # 一个都拦不住。这里不重复跑发布资产相关步骤，只问一个问题：
    # 「同样的源码在 Windows 上构建出来的产物，311 项实测台是不是真的过得去」。
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm run typecheck

      - name: 重新构建 lib/
        run: pnpm exec tsc -p tsconfig.json && pnpm exec tsdown

      # 与 ubuntu 同一道门：Windows 上换行不一致的话，产物 diff 会在这里暴露
      # （.gitattributes 已经把仓库锁成 LF，这条就是它的回归测试）。
      - name: 构建产物必须与源码同步
        run: |
          git add -A lib
          if ! git diff --cached --quiet; then
            echo "::error::lib/ 在 Windows 上与源码重新构建的结果不一致——先看换行符，再看构建步骤"
            git diff --cached --stat
            exit 1
          fi

      - name: 包结构检查
        run: pnpm exec publint

      - name: 实测台
        run: pnpm run verify
